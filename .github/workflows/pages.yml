name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/demo/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # Unit tests only: the integration suite needs multi-gigabyte weights.
      - run: bun test packages/*/test/unit

      - run: bun run --filter '@lfm-encoder/*' build
      - run: bun run --filter '@lfm-encoder/demo' build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
